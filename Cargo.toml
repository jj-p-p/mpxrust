[package]
name = "mpxrust"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust reader for Microsoft Project .mpp files (MPP14, Project 2010-365). A port of the reading subset of MPXJ."
license = "LGPL-2.1-or-later"
repository = "https://github.com/jbarrigq/MPXRust"
keywords = ["mpp", "msproject", "project", "mpxj", "parser"]
categories = ["parser-implementations"]
readme = "README.md"

[dependencies]
cfb = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
